name: CI release

# Build the driver + loader on every push (CI release per commit) and on
# demand. The archive is password-protected ("izuki") because kdmapper-based
# loaders get flagged by scanners; the password keeps AV sandboxes out while
# staying public to humans.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Release x64)
    runs-on: windows-2022
    steps:
      - name: Checkout (with kdmapper submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild (VS2022)
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Install SDK + WDK 26100.6584 (winget, pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = "C:\Program Files (x86)\Windows Kits\10\Include" +
            "\10.0.26100.6584"
          $wdkTaskPat = "C:\Program Files (x86)\Windows Kits\10\build" +
            "\10.0.26100.6584\bin\Microsoft.DriverKit.Build.Tasks.17.0.dll"
          if (-not (Test-Path $sdk)) {
            Write-Host "Installing Windows SDK 10.0.26100..."
            winget install --id Microsoft.WindowsSDK.10.0.26100 `
              --exact --silent --accept-package-agreements `
              --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "SDK 10.0.26100.6584 present"
          }
          if (-not (Test-Path $wdkTaskPat)) {
            Write-Host "Installing Windows WDK 10.0.26100..."
            winget install --id Microsoft.WindowsWDK.10.0.26100 `
              --exact --silent --accept-package-agreements `
              --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "WDK 10.0.26100.6584 present"
          }
          # wdksetup integrates the WDK VSIX into every VS 2022 install it
          # finds. Verify the toolset landed; fail early with a clear message.
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio" +
            "\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -version "[17.0,18.0)" -property installationPath -latest
          $toolset = Join-Path $vsInstall `
            "MSBuild\Microsoft\VC\v170\Platforms\x64" +
            "\PlatformToolsets\WindowsKernelModeDriver10.0"
          if (-not (Test-Path $toolset)) {
            # Fall back to the explicit VSIX install (quiet mode is broken on
            # VS >= 17.14, so tolerate a non-zero exit and re-verify).
            $vsixPat = "C:\Program Files (x86)\Windows Kits\10" +
              "\Vsix\VS2022\*\amd64\WDK.vsix"
            $vsix = Get-ChildItem $vsixPat `
              -ErrorAction SilentlyContinue |
              Sort-Object { $_.Directory.Name } -Descending |
              Select-Object -First 1
            if ($vsix) {
              $vsixInstaller = Join-Path $vsInstall `
                "Common7\IDE\VSIXInstaller.exe"
              $p = Start-Process -FilePath $vsixInstaller `
                -ArgumentList "/q", $vsix.FullName `
                -Wait -NoNewWindow -PassThru
              Write-Host "VSIX exit code: $($p.ExitCode)"
            }
          }
          if (-not (Test-Path $toolset)) {
            Write-Error "WindowsKernelModeDriver10.0 toolset missing in VS2022"
            exit 1
          }
          Write-Host "WDK toolset verified: $toolset"

      - name: Diagnostics (WDK/toolset layout)
        shell: pwsh
        run: |
          Write-Host '--- Windows Kits Include ---'
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' `
            -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host '--- Windows Kits build ---'
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\build' `
            -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host '--- km headers ---'
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits' `
            -Recurse -Filter ntddk.h -ErrorAction SilentlyContinue |
            Select-Object -First 5 FullName
          Write-Host '--- VS instances ---'
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio' +
            '\Installer\vswhere.exe'
          & $vswhere -latest -products * -property installationPath
          Write-Host '--- PlatformToolsets ---'
          $pt = 'C:\Program Files\Microsoft Visual Studio\2022' +
            '\*\MSBuild\Microsoft\VC\v170\Platforms\x64' +
            '\PlatformToolsets'
          Get-ChildItem $pt -ErrorAction SilentlyContinue |
            Select-Object Name

      - name: Build (Release x64)
        shell: cmd
        # CI: use the msbuild placed on PATH by setup-msbuild (VS2022).
        # build.bat's vswhere discovery is fragile inside cmd paren blocks
        # (see build.bat); keep the local script for Windows workstations.
        run: |
          msbuild izukidio\izukidio.vcxproj ^
            /p:Configuration=Release /p:Platform=x64 ^
            /p:SolutionDir=%CD%/ /t:Rebuild /v:m || exit /b 1
          msbuild izukiloader\izukiloader.vcxproj ^
            /p:Configuration=Release /p:Platform=x64 ^
            /p:SolutionDir=%CD%/ /t:Rebuild /v:m || exit /b 1

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = "build\Release"
          $wanted = @('izukidio.sys', 'izukidio.inf',
                      'izukiloader.exe',
                      'izukidio.pdb', 'izukiloader.pdb')
          foreach ($f in $wanted) {
            $src = Join-Path $out $f
            if (Test-Path $src) {
              Copy-Item $src dist\
            } else {
              Write-Host "::warning::missing artifact $f"
            }
          }
          if (-not (Test-Path dist\izukidio.sys)) {
            Write-Error "izukidio.sys was not produced"
            exit 1
          }
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: izukidio-dist
          path: dist/

  release:
    name: CI release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: izukidio-dist
          path: dist/

      - name: Package (password izuki)
        run: |
          cd dist
          7z a -tzip -pizuki \
            "../izukidio-ci-${{ github.run_number }}.zip" .
          cd ..
          7z t -pizuki \
            "izukidio-ci-${{ github.run_number }}.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: >-
            CI build ${{ github.run_number }}
            (${{ github.ref_name }})
          body: |
            Automated CI build of commit ${{ github.sha }}.

            **Archive password: `izuki`**

            Contents: `izukidio.sys` + `izukidio.inf`
            (PnP/test-signing path), `izukiloader.exe`
            (kdmapper-based mapper path), PDBs.

            Research PoC for the Behringer 2902 driver
            reimplementation. Load at your own risk; not signed.
          files: izukidio-ci-${{ github.run_number }}.zip
          generate_release_notes: false
